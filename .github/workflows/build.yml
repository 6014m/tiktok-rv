name: Build TikTok
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: actions/checkout@v4
      - name: Fetch stock TikTok from the "stock" release
        run: |
          mkdir -p temp
          gh release download stock -R ${{ github.repository }} -D temp --pattern "*.apk"
          f=$(ls temp/*.apk | head -1)
          mv "$f" temp/com.zhiliaoapp.musically-46.2.3-all.apk
          ls -la temp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: |
          chmod +x build.sh bin/toml/tq-x86_64
          ./build.sh config.toml
          ls -la build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build log
        if: always()
        run: cat build.md || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TikTok FeedFilter (latest build)
          body_path: build.md
          files: build/*.apk

name: Build TikTok
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['config.toml', '.github/**', 'build.sh', 'utils.sh', 'TRIGGER']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: actions/checkout@v4
      - name: Fetch stock TikTok from the "stock" release
        run: |
          mkdir -p temp
          gh release download stock -R ${{ github.repository }} -D temp --pattern "*.apk"
          f=$(ls temp/*.apk | head -1)
          mv "$f" temp/com.zhiliaoapp.musically-46.2.3-all.apk
          ls -la temp
          echo "Verifying stock APK integrity..."
          { sha256sum temp/com.zhiliaoapp.musically-46.2.3-all.apk
          unzip -t temp/com.zhiliaoapp.musically-46.2.3-all.apk 2>&1 | grep -v " OK$" | tail -20 || true
          python3 - <<'PY'
          import zipfile, sys
          z = zipfile.ZipFile("temp/com.zhiliaoapp.musically-46.2.3-all.apk")
          bad = z.testzip()
          print("python testzip first bad entry:", bad)
          i = z.getinfo("lib/arm64-v8a/libAwebviewbytedance.so")
          print("entry method", i.compress_type, "csize", i.compress_size, "size", i.file_size, "flags", i.flag_bits)
          PY
          } 2>&1 | tee diag.txt
          grep -q "first bad entry: None" diag.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: |
          chmod +x build.sh bin/toml/tq-x86_64
          ./build.sh config.toml 2>&1 | tee full.log; test ${PIPESTATUS[0]} -eq 0
          ls -la build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Post log on failure
        if: failure()
        run: |
          { echo "Build failed. Last 120 lines:"; echo '```'; cat diag.txt 2>/dev/null; grep -v "^\s*$" full.log 2>/dev/null | tail -120 | cut -c1-400; echo '```'; } > err.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@err.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TikTok FeedFilter (latest build)
          body_path: build.md
          files: build/*.apk
